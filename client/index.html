    <!-- SEO local : uniquement des informations vérifiées (cf. BUSINESS_INFO.md).

         2026-09-21 — deux ajouts, chacun adossé à une source du client :
         · openingHours "Tu-Fr 09:00-18:30" — affiche fournie par DPM
           (assets/partenaires et services.png) ET publication de leur page
           Facebook, qui écrit « Ouvert du mardi au vendredi de 9h à 18h30 »
           sans réserve. L'affiche ajoute « (*sauf RDV les mercredi et
           vendredi) » : trop ambigu pour être balisé, en clarification.
           Lundi et samedi ne sont annoncés par aucune source : ils ne sont
           donc pas déclarés, ni ouverts ni fermés.
         · postalCode "78320" — même publication Facebook, qui donne l'adresse
           complète. Il manquait faute de source ; il en a une maintenant.
         Le point relais colis est décrit, pas balisé : schema.org n'a pas de
         type qui lui corresponde sans forcer. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeAndConstructionBusiness",
        "name": "DPM Marigot",
